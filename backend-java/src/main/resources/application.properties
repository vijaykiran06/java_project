spring.application.name=janseva-backend
server.port=${PORT:8080}

# Primary Supabase PostgreSQL Database Configuration (Auto-switches or falls back seamlessly)
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://db.ihpodvncbkipopzxtpnn.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.postgresql.Driver}

# HikariCP Connection Pool Configuration (Optimized for Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate & JPA Configuration
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Security Configuration
janseva.jwt.secret=${JWT_SECRET:sih_super_secret_jwt_key_2026_grievance_portal}
janseva.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Python FastAPI ML Microservice Configuration
janseva.ml.base-url=${ML_SERVICE_URL:http://127.0.0.1:8001}
janseva.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
janseva.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:10000}

# Translation Integration
janseva.translation.enabled=${TRANSLATION_ENABLED:true}
janseva.translation.base-url=${TRANSLATION_BASE_URL:https://translate.googleapis.com}

# CORS Allowed Origins
janseva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# SLA Scheduler Interval (30 seconds)
janseva.sla.poll-interval-ms=${SLA_POLL_INTERVAL_MS:30000}
janseva.sla.scheduler-enabled=${SLA_SCHEDULER_ENABLED:true}
